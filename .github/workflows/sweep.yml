name: Ground Truth Sweep

# Run the suite against real DynamoDB in every commercial region, producing
# per-region ground truth (ground-truth/<region>.json plus its indeterminate
# sidecar), then detect regional splits and record region health. Weekly, and
# gating nothing: PR gating stays offline and deterministic, and a red region
# here degrades to an unresolved verdict rather than a blocked build.
#
# Output goes to ground-truth/, never results/: any results/<slug>.json is
# automatically scored, badged and published as a target row, so a per-region
# file landing there would fabricate phantom targets and redden the PR gate.
#
# It also carries the two daily orphan cleanups, one per table namespace: the
# `_conformance_` sweep the runs here strand tables in, and the `_capture_`
# sweep backstopping ad-hoc local capture sessions. Separate crons and separate
# jobs, so each namespace's failure is its own alarm.
on:
  schedule:
    - cron: '0 3 * * 6' # sweep: 3am UTC Saturday, clear of Sunday's gating run
    - cron: '0 4 * * *' # cleanup: daily, the _capture_ namespace's backstop
    - cron: '30 5 * * *' # cleanup: daily, catching tables a dead run stranded
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region subset (blank = all commercial regions)"
        required: false
        default: ""
      # false = report-only reconnaissance: full sweep, full confirmation, the
      # report artefact only. No health recording, no drops or pages, no
      # issues. The schedule always records (an absent input reads as true).
      record:
        description: "Record region health and file issues (false = report-only)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  regions:
    name: Resolve region set
    # Only the weekly cron (or a manual dispatch) sweeps; the daily cron only cleans up.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 6'
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.set.outputs.regions }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # src/regions.ts is the single source of the region set; the matrix is
      # derived from it rather than hand-maintained here.
      - name: Derive the matrix from src/regions.ts
        id: set
        env:
          SUBSET: ${{ github.event.inputs.regions }}
        run: |
          regions=$(node --input-type=module -e '
            const { COMMERCIAL_REGIONS } = await import("./src/regions.ts")
            const subset = (process.env.SUBSET ?? "").split(",").map((s) => s.trim()).filter(Boolean)
            const unknown = subset.filter((r) => !COMMERCIAL_REGIONS.includes(r))
            if (unknown.length > 0) {
              console.error(`unknown region(s): ${unknown.join(", ")}`)
              process.exit(1)
            }
            console.log(JSON.stringify(subset.length > 0 ? subset : [...COMMERCIAL_REGIONS]))
          ')
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Sweeping: $regions"

  sweep:
    name: ${{ matrix.region }}
    needs: regions
    runs-on: ubuntu-latest
    # Inside the 2h OIDC credential window: a region slower than this cannot
    # finish anyway, and the health gate will read its truncated output as
    # unresolved rather than counting a partial run.
    timeout-minutes: 115
    strategy:
      # A failing region must never block the others.
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.regions) }}
    # DynamoDB tables are regional, so regions cannot race each other - but the
    # eu-west-2 job shares a region with the gating job in conformance.yml,
    # whose by-prefix cleanup would delete this job's tables mid-run (and vice
    # versa). It must join the same conformance-aws queue; every other region
    # gets its own group so two sweeps cannot overlap in one region.
    concurrency:
      group: ${{ matrix.region == 'eu-west-2' && 'conformance-aws' || format('sweep-{0}', matrix.region) }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    environment: conformance-testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The role is assumed via us-east-1's STS endpoint, not the target
      # region's. An opt-in region whose enablement has not fully propagated has
      # no reachable regional STS endpoint, so assuming there blackholes for
      # ~80 minutes of retries and the region produces nothing. The credentials
      # are global; the suite step below sets AWS_REGION to the target region.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200

      # The gating scope (the full suite minus the GSI lifecycle file, whose
      # 5-15 minute backfills per index would bust the credential window, and
      # the S3/Kinesis service-integration suites, which no emulator implements
      # and which carry their own non-gating job). Discovery is never narrowed
      # to known splits: every region runs every scored test.
      #
      # continue-on-error: a real region failing a committed assertion IS the
      # split signal this sweep exists to find, not a CI failure. The detect
      # job carries the meaning; a region that produced nothing at all is read
      # as unresolved there, never silently green here.
      - name: Run the suite against ${{ matrix.region }}
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: ${{ matrix.region }}
          CONFORMANCE_RESULTS_DIR: ground-truth
          AWS_REGION: ${{ matrix.region }}
          # Same flake absorption as the gating job: a one-off throttle passes
          # on the retry, real drift fails deterministically and survives it.
          CONFORMANCE_RETRY: '1'
        run: npm run test:gating -- --reporter=json --outputFile=ground-truth/${{ matrix.region }}.json

      - name: Sanitize account IDs
        if: always()
        run: node scripts/sanitize-arns.mjs

      - name: Cleanup conformance tables
        if: always()
        timeout-minutes: 3
        env:
          AWS_REGION: ${{ matrix.region }}
        run: |
          aws dynamodb list-tables --query "TableNames[?starts_with(@, '_conformance_')]" --output text | \
          tr '\t' '\n' | \
          xargs -P4 -I{} aws dynamodb delete-table --table-name {} 2>/dev/null || true

      # Uploaded under a non `results-*` name so the Update Results Table
      # overlay (which globs results-*) never folds a region into the published
      # target comparison.
      - name: Upload ground truth
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ground-truth-${{ matrix.region }}
          path: ground-truth/

  detect:
    name: Detect splits and record health
    needs: [regions, sweep]
    # always(): a region going red (or missing entirely) is exactly what this
    # job exists to interpret, so it must run whatever the matrix did.
    if: always() && needs.regions.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    # Targeted confirmation re-runs single tests in whichever regions disagreed,
    # eu-west-2 included, so this job joins the same queue as the gating job's
    # by-prefix cleanup rather than racing it.
    concurrency:
      group: conformance-aws
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      issues: write # split-candidate, registry-drift and region-dropped issues
    environment: conformance-testing
    env:
      # The ONE definition of report-only: recording is on for the schedule
      # and for any dispatch that does not explicitly say record: false. Both
      # the detect step and the commit step read this - recording health and
      # committing it must never disagree.
      RECORD: ${{ github.event.inputs.record != 'false' }}

    steps:
      # registry/regions.json (region health) is committed back, so the
      # checkout uses the results bot's token. registry/splits.json is never
      # written by anything here: detection files issues, a human admits rows.
      - name: Mint a token for the results bot
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RESULTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESULTS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 7200

      - name: Download the per-region results
        uses: actions/download-artifact@v8
        with:
          pattern: ground-truth-*
          path: ground-truth
          merge-multiple: true

      - name: Detect splits, confirm them, record region health
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: ${{ needs.regions.outputs.regions }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          flags=()
          if [ "$RECORD" = "true" ]; then
            flags+=(--record-health registry/regions.json --file-issues)
          fi
          node scripts/sweep-detect.mjs ground-truth \
            --expect "$(node -e 'console.log(JSON.parse(process.env.EXPECT).join(","))')" \
            --confirm \
            --run-url "$RUN_URL" \
            --out ground-truth/sweep-report.json \
            "${flags[@]}"

      - name: Upload the sweep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sweep-report
          path: ground-truth/sweep-report.json

      # A full sweep's confirmation tail runs well over an hour, outliving the
      # results-bot token minted at job start (a GitHub App token lives ~1h). The
      # health push at the end is re-authed with a freshly minted token, or it
      # fails with "could not read Username" and the record is lost.
      - name: Re-mint the bot token for the health push
        id: health-token
        if: always() && env.RECORD == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RESULTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESULTS_BOT_PRIVATE_KEY }}
          permission-contents: write

      # always(): the health record is written BEFORE the long confirmation
      # tail precisely so a timeout or crash there cannot lose it - but this
      # step inheriting the implicit success() would throw it away again.
      # Page issues are filed before confirmation too, so committing a drop
      # from a failed run never splits the drop-and-page act.
      - name: Commit the region health record
        if: always() && env.RECORD == 'true'
        env:
          BOT_TOKEN: ${{ steps.health-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-auth with the freshly minted token; checkout's persisted one has expired.
          git remote set-url origin "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}.git"
          git add registry/regions.json

          # The published board is derived from this record, so it moves with
          # it: the observed set is the denominator of every target's Regions
          # column, and admitting or dropping a region can change which region
          # is a target's headline and so its grade. Both the table and the
          # badges read the health record through the shared scorer.
          #
          # Regenerating here rather than leaving it to a later run, because
          # there is no later run: all three paths below sit in conformance.yml's
          # paths-ignore, so this push starts no conformance run, and the results
          # table only publishes off one. The board would keep the previous
          # region set until an unrelated merge happened to refresh it, and the
          # freshness tests in the cheap gate would hold main red until then.
          # Regeneration degrades rather than aborting the step. Both scripts
          # refuse to publish rather than publish something wrong - summarise
          # asserts the suite it is scoring against, and the observed set it
          # reads is the one this sweep just wrote - and the step runs under
          # `bash -e`, so a throw between staging the record and committing it
          # would end the step with the record uncommitted on a runner about to
          # vanish. That is the loss the always() above exists to prevent, and
          # it would cost a week of health for a board that can be rebuilt on
          # the next run. So the record is committed either way, and a board
          # that could not be rebuilt leaves main red and says so - the state
          # this step was already in before it regenerated anything.
          # Regeneration is unconditional, and the "nothing to do" exit comes
          # after it rather than before. Gating it on the record having changed
          # would strand exactly the run that needs it: a degraded run commits
          # the record with a stale board, and the obvious way to fix that -
          # re-running the sweep by hand the same day - produces a byte-identical
          # record, so a gate on the record alone would skip the rebuild and do
          # nothing. Rebuilding costs a second or two and is idempotent, so the
          # step is safe to re-run and self-heals whether or not health moved.
          msg="chore: update region health and the board derived from it"
          if node scripts/summarise.mjs --write && node scripts/badges.mjs; then
            git add README.md results
            if git diff --staged --quiet -- registry/regions.json; then
              # Health did not move, so this run only rebuilt a board that had
              # drifted from it. Say that rather than claim a health update.
              msg="chore: rebuild the board from the region health record"
            fi
          else
            echo "::warning title=Board::regeneration failed; committing the health record alone. The board is stale until a later run rebuilds it, and main stays red on the freshness tests until then."
            # publish() splices README.md before it writes results/summary.json,
            # so a half-written board is possible and has to go rather than be
            # committed as though it were derived from the record beside it.
            git checkout -- README.md results
            msg="chore: update region health"
          fi

          if git diff --staged --quiet; then
            echo "Region health unchanged, and the board already matches it."
            exit 0
          fi

          git commit -m "$msg"
          pushed=0
          for i in 1 2 3; do
            # A conflicted `git pull --rebase` leaves the rebase in progress and
            # every later pull refuses while one is, so without this the second
            # and third attempts cannot do anything the first did not.
            git rebase --abort 2>/dev/null || true
            if git pull --rebase && git push; then pushed=1; break; fi
            echo "push attempt $i failed; retrying"
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::warning title=Region health::push failed after 3 attempts; this sweep's health record was not persisted"
            exit 1
          fi

  cleanup:
    name: Clean up orphaned tables
    # Runs after every sweep (skipped or not - the 5.30 cron skips the matrix
    # and comes straight here) so tables stranded by a dead run never sit for
    # more than a day. The age gate inside the cleanup is what keeps runs still
    # in flight safe; see scripts/cleanup-orphans.mjs.
    #
    # The 4am cron belongs to the capture job below, so it is excluded here:
    # this run stays exactly as narrow as the by-prefix teardown it backstops.
    needs: sweep
    if: always() && github.event.schedule != '0 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    environment: conformance-testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 3600

      - name: Clean up orphans across all regions
        run: node scripts/cleanup-orphans.mjs

  capture-cleanup:
    name: Clean up orphaned capture tables
    # The backstop for the `_capture_` namespace. A local capture session tears
    # its own tables down by exact name when it ends; this catches what a
    # session that died mid-flight left behind. Its own cron and its own job
    # rather than a second prefix on the run above, so a capture-side failure
    # reddens a run of its own and stays legible as a capture problem.
    #
    # No `needs`: the matrix never runs on this cron, and the two namespaces
    # have nothing to sequence between them.
    #
    # Seven hours gates this the same as the conformance sweep, but as a
    # convention rather than the derived credential bound it is there - nothing
    # stops a local session running longer. See scripts/cleanup-orphans.mjs.
    if: github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    environment: conformance-testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 3600

      - name: Clean up capture orphans across all regions
        run: node scripts/cleanup-orphans.mjs --prefix _capture_
