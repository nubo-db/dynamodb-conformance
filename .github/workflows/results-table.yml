name: Update Results Table

# Regenerate the README results table from a conformance run's artifacts and
# commit it back. Runs automatically when a Conformance Tests run finishes on
# main, and on demand from the Actions tab.
on:
  workflow_run:
    workflows: ["Conformance Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Conformance run to pull results from (blank = latest completed)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

# Serialise table commits so a manual run and an auto run can't race the push.
concurrency:
  group: results-table
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Manual runs always proceed; auto runs only for successful main runs (skip
    # PR conformance runs, which must never write to main).
    # head_branch alone is not a gate. A pull request from a fork runs
    # conformance.yml with the fork's own workflow and test code, uploads
    # results-* artefacts, and reports head_branch as the branch name in the
    # fork - so a PR opened from a fork branch called `main` passed this and
    # had its artefacts committed to main and published, badges included.
    # The head_repository check is what closes that, not the event list: a fork
    # PR is excluded because its run belongs to the fork, whatever it is called.
    # So the event list is only about which runs are a measurement worth
    # publishing, and the weekly cron is the main one. Omitting `schedule` would
    # have meant a Sunday run measuring every target and publishing none of it,
    # leaving the board to move only on a merge to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Mint a token for the results bot
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RESULTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESULTS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve conformance run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment: this job holds a contents-write token, and
          # a dispatch input spliced into the script would run in it.
          REQUESTED_RUN_ID: ${{ github.event.inputs.run_id }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RID="$REQUESTED_RUN_ID"
          [ -z "$RID" ] && RID="$AUTO_RUN_ID"
          if [ -z "$RID" ]; then
            # The latest completed run on main, not simply the latest completed
            # run - which on any day with an open pull request is that pull
            # request's.
            RID=$(gh run list --workflow conformance.yml --status completed --branch main -L 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RID" ]; then
            echo "No completed Conformance Tests run found." >&2
            exit 1
          fi

          # Whatever route produced the id, the run it names has to be one this
          # repository's own code produced on main.
          #
          # The job's `if:` above checks exactly this for the automatic path,
          # and says why: a pull request from a fork runs the fork's workflow
          # and test code and uploads results-* artefacts under its own branch
          # name. But `workflow_dispatch` short-circuits that condition, and
          # nothing then constrained the run id - so a manual run given a fork
          # pull request's id would download that fork's artefacts, commit them
          # to main and publish the badges. The id is only known once resolved,
          # so the check belongs here rather than in the `if:`.
          META=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RID" \
            --jq '[.head_repository.full_name, .head_branch, .conclusion] | @tsv')
          HEAD_REPO=$(cut -f1 <<<"$META")
          BRANCH=$(cut -f2 <<<"$META")
          CONCLUSION=$(cut -f3 <<<"$META")
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$BRANCH" != "main" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Run $RID is $CONCLUSION on $BRANCH in $HEAD_REPO, not a successful run on main in $GITHUB_REPOSITORY. Refusing to publish its artefacts."
            exit 1
          fi

          echo "id=$RID" >> "$GITHUB_OUTPUT"
          echo "Pulling results from conformance run $RID ($HEAD_REPO@$BRANCH)"

      - name: Overlay result artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" \
            --pattern 'results-*' \
            --pattern 'integration-results' \
            --pattern 'ground-truth-gsi' \
            --dir /tmp/artifacts
          # Each results-<target> artifact carries that target's fresh files
          # (plus stale copies of the others), so take only each target's own.
          shopt -s nullglob
          for d in /tmp/artifacts/results-*/; do
            target=$(basename "$d"); target=${target#results-}
            for f in "$d$target.json" "$d$target.version"; do
              [ -f "$f" ] && cp -f "$f" results/
            done
            # The indeterminate sidecar qualifies the results file it sits
            # beside: carry it when the run wrote one, and clear a stale
            # committed one when it didn't - a clean run must leave no sidecar.
            rm -f "results/$target.indeterminate.json"
            if [ -f "$d$target.indeterminate.json" ]; then
              cp -f "$d$target.indeterminate.json" results/
            fi
          done

          # Real AWS is observed in three lanes rather than one: the gating run,
          # plus the service-integration and GSI-lifecycle jobs, whose runtimes
          # don't fit the gating credential window. Both upload outside the
          # results-* space so the loop above can never seat them as targets, so
          # they are copied in here instead, under the sibling names
          # scripts/summarise.mjs folds into the ground-truth document.
          #
          # A lane that didn't run is carried, not cleared. These two only run
          # on schedule and dispatch, while this workflow fires on every
          # conformance run including push, so clearing them would delete the
          # last sweep's evidence within a day and drop the baseline row back
          # to pinned. Each lane publishes its own capture date, so a carried
          # lane is dated rather than passed off as this run's.
          for lane in "integration-results/dynamodb.json:dynamodb.integrations.json" \
                      "ground-truth-gsi/gsi.json:dynamodb.gsi.json"; do
            src="/tmp/artifacts/${lane%%:*}"
            dest="results/${lane##*:}"
            if [ -f "$src" ]; then
              cp -f "$src" "$dest"
              # The sidecar travels with the document it qualifies. Without it
              # a run-level indeterminate in the lane reads as plain failures,
              # the tests count as observed, and the baseline row derives from
              # a run that never answered.
              rm -f "${dest%.json}.indeterminate.json"
              if [ -f "${src%.json}.indeterminate.json" ]; then
                cp -f "${src%.json}.indeterminate.json" "${dest%.json}.indeterminate.json"
              fi
            fi
          done

          # These two lanes drive live S3, Kinesis and KMS, so their failure
          # messages carry bucket names, stream and role ARNs and request IDs,
          # and the documents are committed to a public repo. Nothing
          # downstream reads the message - the lanes are folded in on test
          # identity - so it is cleared before it can be committed.
          node scripts/strip-lane-detail.mjs \
            results/dynamodb.integrations.json results/dynamodb.gsi.json

      # Only the real-AWS lanes sanitise before upload, because only they can
      # carry an account ID. Vitest absolutises every test path against the
      # checkout it ran in regardless, so every emulator artefact arrives
      # carrying the runner's `/home/runner/work/...` prefix. Sanitising here
      # covers all of them on the one path that commits, whatever each lane
      # uploaded.
      - name: Sanitize account IDs and machine paths
        run: node scripts/sanitize-arns.mjs

      # The check that the step above did its job, on the exact files about to
      # be committed. It was written for this path and had never been wired to
      # anything, so nothing verified the sanitising before these files were
      # committed.
      - name: Refuse to commit a leaked account ID
        run: node scripts/check-account-ids.mjs

      # Rewrites the README block between the results markers and refreshes
      # results/summary.json, the versioned per-region artefact the site reads.
      - name: Regenerate results table and summary
        run: node scripts/summarise.mjs --write

      - name: Regenerate per-target badges
        run: node scripts/badges.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md
          if git diff --staged --quiet; then
            echo "Results table already up to date."
          else
            git commit -m "chore: update results table"
            git pull --rebase
            git push
          fi
