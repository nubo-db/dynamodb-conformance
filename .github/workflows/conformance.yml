name: Conformance Tests

on:
  schedule:
    - cron: '0 6 * * 1' # 6am UTC every Monday
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extenddb_ref:
        description: "ExtendDB git ref to build (blank = latest release)"
        required: false
        default: ""
  repository_dispatch:
    types: [dynoxide-release, extenddb-release]

permissions:
  contents: read

jobs:
  test-dynamodb:
    name: DynamoDB (ground truth)
    runs-on: ubuntu-latest
    # Runs on a merge to main, the weekly schedule, and a manual dispatch (on any
    # ref) - never on a pull request, so PRs stay on the emulator jobs and never
    # spend real-AWS time. Verify a branch on demand with a dispatch on its ref.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Serialise AWS runs: the suite shares one account and cleanup deletes every
    # _conformance_ table by prefix, so overlapping runs delete each other's
    # tables. Queue rather than cancel — a cancelled run leaves orphan tables.
    concurrency:
      group: conformance-aws
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      issues: write # file/update a scheduled-red issue on a deterministic failure
    environment: conformance-testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 7200

      - name: Run gating conformance suite (excludes GSI lifecycle and integration suites — see README)
        env:
          CONFORMANCE_TARGET: dynamodb
          AWS_REGION: eu-west-2
          # Absorb transient flakes on the one gating job. Real drift fails
          # deterministically and survives the retry; a one-off throttle passes.
          CONFORMANCE_RETRY: '1'
        run: npm run test:gating

      - name: Sanitize account IDs
        if: always()
        run: node scripts/sanitize-arns.mjs

      - name: Cleanup conformance tables
        if: always()
        timeout-minutes: 3
        run: |
          aws dynamodb list-tables --query "TableNames[?starts_with(@, '_conformance_')]" --output text | \
          tr '\t' '\n' | \
          xargs -P4 -I{} aws dynamodb delete-table --table-name {} 2>/dev/null || true

      - name: Record target version
        continue-on-error: true
        env:
          AWS_REGION: eu-west-2
        run: scripts/record-version.sh dynamodb

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-dynamodb
          path: results/

      # A scheduled red survived the retry, so it is deterministic: either real
      # AWS drift or a flake the retry missed. Re-capture eu-west-2's raw wording
      # and diff it against the committed baseline so the failure can be labelled
      # drift-versus-flake. continue-on-error: a capture hiccup must not block the
      # issue - the reporter falls back to a generic triage note without a verdict.
      - name: Compute the drift verdict
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          AWS_REGION: eu-west-2
        run: |
          node scripts/capture-validation-messages.mjs eu-west-2 > "$RUNNER_TEMP/euw2.json"
          node scripts/drift-diff.mjs "$RUNNER_TEMP/euw2.json" \
            --baseline captures/2026-06-09-validation-rewording.json \
            --region eu-west-2 --out "$RUNNER_TEMP/drift.json"

      # File or update a single deduped issue so a red Monday is actionable, not a
      # silent X. The drift verdict (if computed above) labels it aws-drift-confirmed
      # or likely-flake and fills the body's triage slot.
      - name: Report a deterministic failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          drift_args=()
          if [ -f "$RUNNER_TEMP/drift.json" ]; then
            drift_args=(--drift "$RUNNER_TEMP/drift.json" --verdict-out "$RUNNER_TEMP/verdict.txt")
          fi
          node scripts/report-failure.mjs results/dynamodb.json "$RUN_URL" "${drift_args[@]}" > "$RUNNER_TEMP/issue-body.md"

          gh label create scheduled-red       --color B60205 --description "Scheduled conformance run went red" 2>/dev/null || true
          gh label create aws-drift-confirmed  --color 5319E7 --description "Scheduled red is confirmed AWS wording drift" 2>/dev/null || true
          gh label create likely-flake         --color FBCA04 --description "Scheduled red shows no wording drift; likely transient" 2>/dev/null || true

          labels="scheduled-red"
          if [ -f "$RUNNER_TEMP/verdict.txt" ]; then
            labels="$labels,$(cat "$RUNNER_TEMP/verdict.txt")"
          fi

          existing=$(gh issue list --label scheduled-red --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --add-label "$labels" >/dev/null
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --label "$labels" \
              --title "Scheduled conformance run went red ($(date -u +%Y-%m-%d))" \
              --body-file "$RUNNER_TEMP/issue-body.md"
          fi

  test-dynamodb-integrations:
    name: DynamoDB service integrations (non-gating)
    # DynamoDB's integrations with other AWS services (S3 export/import, Kinesis
    # streaming destinations). No emulator implements them, so they can't be
    # compared, and they lean on slow async calls - so they run off the gating
    # path and continue-on-error, where a slow import can't red the build.
    # `needs` plus the shared conformance-aws group serialise this against the
    # gating job so the two don't race the by-prefix table cleanup; `always()`
    # keeps it running even when the gate is red.
    needs: test-dynamodb
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-latest
    concurrency:
      group: conformance-aws
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    environment: conformance-testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 7200

      - name: Run service-integration suite (S3 export/import, Kinesis)
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: dynamodb
          AWS_REGION: eu-west-2
        run: npm run test:integrations

      - name: Sanitize account IDs
        if: always()
        run: node scripts/sanitize-arns.mjs

      - name: Cleanup conformance tables
        if: always()
        timeout-minutes: 3
        run: |
          aws dynamodb list-tables --query "TableNames[?starts_with(@, '_conformance_')]" --output text | \
          tr '\t' '\n' | \
          xargs -P4 -I{} aws dynamodb delete-table --table-name {} 2>/dev/null || true

      # Uploaded under a non `results-*` name so the Update Results Table overlay
      # (which globs results-*) never folds this into the published comparison.
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: results/

  capture-cross-region:
    name: Cross-region drift capture (non-gating)
    # Capture real AWS's negative-input wording in the candidate regions each
    # week and commit it, so the paritysuite drift lens has fresh, versioned data
    # (the site builds from committed files, not CI artefacts). Non-gating: a
    # capture hiccup never touches the build. Only candidate regions are
    # captured, never eu-west-2: the IAM role forces a _conformance_ table prefix
    # that the gating job's cleanup deletes, so an eu-west-2 capture here would
    # race that cleanup. The lens diffs these against the committed eu-west-2
    # baseline; the scheduled-run drift verdict flags when the baseline itself
    # needs refreshing.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: conformance-testing

    steps:
      - name: Mint a token for the capture bot
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RESULTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESULTS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 7200

      - name: Capture candidate regions
        run: |
          node scripts/capture-validation-messages.mjs us-east-1 ap-southeast-2 eu-central-1 \
            > captures/cross-region-latest.json

      - name: Commit the capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures/cross-region-latest.json
          if git diff --staged --quiet; then
            echo "Cross-region capture unchanged."
          else
            git commit -m "chore: update cross-region capture [skip ci]"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then pushed=1; break; fi
              echo "push attempt $i failed; retrying"
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::warning title=Cross-region capture::push failed after 3 attempts; this week's capture was not persisted"
              exit 1
            fi
          fi

  test-dynamodb-local:
    name: DynamoDB Local
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run conformance suite
        continue-on-error: true # Emulators have known conformance gaps
        env:
          CONFORMANCE_TARGET: dynamodb-local
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          TARGET_IMAGE: amazon/dynamodb-local:latest
        run: scripts/record-version.sh dynamodb-local

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-dynamodb-local
          path: results/

  test-localstack:
    name: LocalStack
    continue-on-error: true
    runs-on: ubuntu-latest
    # LOCALSTACK_AUTH_TOKEN is not exposed to PRs from forks, and the
    # LocalStack image refuses to start without it. Skip the job rather
    # than leave a spurious red X on every external PR.
    if: github.event.pull_request.head.repo.fork != true
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run conformance suite
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: localstack
          DYNAMODB_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          TARGET_IMAGE: localstack/localstack:latest
        run: scripts/record-version.sh localstack

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-localstack
          path: results/

  test-dynoxide:
    name: Dynoxide
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start Dynoxide
        run: |
          npx dynoxide --port 8001 &
          sleep 2

      - name: Run conformance suite
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: dynoxide
          DYNAMODB_ENDPOINT: http://localhost:8001
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        run: scripts/record-version.sh dynoxide

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-dynoxide
          path: results/

  test-floci:
    name: Floci
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run conformance suite
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: floci
          DYNAMODB_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          TARGET_IMAGE: floci/floci:latest
        run: scripts/record-version.sh floci

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-floci
          path: results/

  test-ministack:
    name: Ministack
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports:
          - 4566:4566

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run conformance suite
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: ministack
          DYNAMODB_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          TARGET_IMAGE: ministackorg/ministack:latest
        run: scripts/record-version.sh ministack

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-ministack
          path: results/

  test-dynalite:
    name: Dynalite
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start Dynalite
        run: |
          npx -y dynalite --port 8002 &
          sleep 2

      - name: Run conformance suite
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: dynalite
          DYNAMODB_ENDPOINT: http://localhost:8002
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        run: scripts/record-version.sh dynalite

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-dynalite
          path: results/

  test-extenddb:
    name: ExtendDB
    # ExtendDB ships no binaries and `main` is a moving target, so CI builds its
    # latest tagged *release* from source (override via the workflow_dispatch
    # input). The Rust build makes this the heaviest job, so it skips PRs and
    # runs on push, the weekly schedule, manual dispatch, and ExtendDB releases.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Resolve ExtendDB ref (latest release unless overridden)
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF='${{ github.event.inputs.extenddb_ref }}'
          if [ -z "$REF" ]; then
            REF=$(gh release view -R ExtendDB/extenddb --json tagName --jq .tagName)
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building ExtendDB at $REF"

      - name: Checkout ExtendDB
        uses: actions/checkout@v7
        with:
          repository: ExtendDB/extenddb
          ref: ${{ steps.ref.outputs.ref }}
          path: extenddb

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extenddb

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and start ExtendDB, mint conformance credentials
        env:
          EXTENDDB_DIR: ${{ github.workspace }}/extenddb
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/run-extenddb.sh

      - name: Run conformance suite
        continue-on-error: true # ExtendDB has known gaps (e.g. PartiQL)
        env:
          CONFORMANCE_TARGET: extenddb
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          EXTENDDB_REF: ${{ steps.ref.outputs.ref }}
        run: scripts/record-version.sh extenddb

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-extenddb
          path: results/
