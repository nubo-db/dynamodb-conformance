name: Conformance Tests

on:
  schedule:
    - cron: '0 4 * * 0' # 4am UTC every Sunday, when AWS is quieter
  push:
    branches: [main]
    # Never re-run real-AWS conformance on the suite's own bot output. These
    # are the four paths the automated jobs write back to main: the results
    # table and its artefacts (results-table.yml), the region health record
    # (sweep.yml), and the cross-region capture this workflow commits itself.
    # Without the last one it would re-trigger on its own commit. The cheap
    # gate in ci.yml deliberately does NOT ignore these - it is what checks the
    # bots wrote self-consistent output - so only the expensive run is filtered.
    paths-ignore:
      - 'results/**'
      - 'README.md'
      - 'registry/regions.json'
      - 'captures/**'
      - 'site/**'
  pull_request:
    # The site workspace cannot change how a target behaves, so a site-only PR
    # has no reason to spin up an emulator per target and run the suite against
    # each. This is where the repo merge would otherwise cost real time; the
    # cheap gate in ci.yml still runs on every PR.
    paths-ignore:
      - 'site/**'
  workflow_dispatch:
    inputs:
      extenddb_ref:
        description: "ExtendDB git ref to build (blank = latest release)"
        required: false
        default: ""
      dynoxide_wasm_ref:
        description: "Dynoxide git ref to build the wasm engine from (blank = latest release)"
        required: false
        default: ""
  # No repository_dispatch. A `[dynoxide-release, extenddb-release]` trigger
  # sat here and nothing ever fired it - the sending repo dispatches to its own
  # docs site, not to this one - so it read as a live path and was not one, and
  # the ground-truth jobs excluded the event anyway. Wiring it up is the wrong
  # fix rather than the missing one: two named targets would refresh the whole
  # board within minutes of their own release while the other six waited for
  # Sunday, and one of the two is the board author's engine. Every target's row
  # is refreshed together, by the weekly cron or by a merge to main, or the
  # dates in the table stop meaning the same thing per row.

permissions:
  contents: read

jobs:
  # Whether this push changed anything that could move a measurement against
  # real DynamoDB. Real DynamoDB's behaviour is AWS's, so what makes the
  # ground-truth run worth repeating is a change to the tests driving it or the
  # harness running them, not a dependency bump, a workflow edit or the docs.
  #
  # Without this, merging any dependency update started a live AWS run. Those
  # hold the shared conformance account for their whole duration, and the
  # account is also what a maintainer probes by hand, so a routine merge could
  # block someone mid-investigation with no warning. Every dependency PR the
  # repo has seen touched lockfiles, manifests or workflows and none touched
  # tests/ or src/, so keying on those two keeps the same-day refresh for real
  # suite changes and drops it for the rest.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.filter.outputs.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          decide() { echo "suite=$1" >>"$GITHUB_OUTPUT"; echo "suite=$1 ($2)"; exit 0; }

          # A schedule or a dispatch is an explicit request to measure.
          [ "$EVENT" = "push" ] || decide true "$EVENT is not a push"

          # A first push, a force-push, or a parent this checkout cannot see
          # leaves nothing to diff. Measure rather than guess.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            decide true "no comparable parent"
          fi

          # tests/ is the assertions, src/ is the harness that drives them, and
          # vitest.config.ts sets the timeouts, retries and include glob a run
          # is made under. An SDK bump is deliberately not here: it would match
          # every dependency PR and so undo this, and the weekly run picks the
          # new client up within seven days.
          if git diff --name-only "$BEFORE" "$AFTER" \
            | grep -qE '^(tests|src)/|^vitest\.config\.ts$'; then
            decide true "the suite or the harness changed"
          fi
          decide false "nothing outside the suite changed"

  test-dynamodb:
    name: DynamoDB (ground truth)
    runs-on: ubuntu-latest
    needs: changes
    # The weekly schedule and a manual dispatch (on any ref) always measure. A
    # merge to main measures only when it touched the suite - see the `changes`
    # job for why. Never on a pull request, so PRs stay on the emulator jobs and
    # never spend real-AWS time. Verify a branch on demand with a dispatch on
    # its ref, which is also how to force a refresh after a merge that skipped.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.suite == 'true')
    # Serialise AWS runs: the suite shares one account and cleanup deletes every
    # _conformance_ table by prefix, so overlapping runs delete each other's
    # tables. Queue rather than cancel — a cancelled run leaves orphan tables.
    concurrency:
      group: conformance-aws
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      issues: write # file/update a scheduled-red issue on a deterministic failure
    environment: conformance-testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 7200

      - name: Run gating conformance suite (excludes GSI lifecycle and integration suites — see README)
        env:
          CONFORMANCE_TARGET: dynamodb
          AWS_REGION: eu-west-2
          # Absorb transient flakes on the one gating job. Real drift fails
          # deterministically and survives the retry; a one-off throttle passes.
          CONFORMANCE_RETRY: '1'
        run: npm run test:gating

      - name: Sanitize account IDs
        if: always()
        run: node scripts/sanitize-arns.mjs

      - name: Cleanup conformance tables
        if: always()
        timeout-minutes: 3
        run: |
          aws dynamodb list-tables --query "TableNames[?starts_with(@, '_conformance_')]" --output text | \
          tr '\t' '\n' | \
          xargs -P4 -I{} aws dynamodb delete-table --table-name {} 2>/dev/null || true

      - name: Record target version
        continue-on-error: true
        env:
          AWS_REGION: eu-west-2
        run: scripts/record-version.sh dynamodb

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-dynamodb
          path: results/

      # A scheduled red survived the retry, so it is deterministic: either real
      # AWS drift or a flake the retry missed. Re-capture eu-west-2's raw wording
      # and diff it against the committed baseline so the failure can be labelled
      # drift-versus-flake. continue-on-error: a capture hiccup must not block the
      # issue - the reporter falls back to a generic triage note without a verdict.
      - name: Compute the drift verdict
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          AWS_REGION: eu-west-2
        run: |
          node scripts/capture-validation-messages.mjs eu-west-2 > "$RUNNER_TEMP/euw2.json"
          node scripts/drift-diff.mjs "$RUNNER_TEMP/euw2.json" \
            --baseline captures/2026-07-13-empty-set-member.json \
            --region eu-west-2 --out "$RUNNER_TEMP/drift.json"

      # File or update a single deduped issue so a red scheduled run is actionable,
      # not a silent X. The drift verdict (if computed above) labels it aws-drift-confirmed
      # or likely-flake and fills the body's triage slot.
      - name: Report a deterministic failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          drift_args=()
          if [ -f "$RUNNER_TEMP/drift.json" ]; then
            drift_args=(--drift "$RUNNER_TEMP/drift.json" --verdict-out "$RUNNER_TEMP/verdict.txt")
          fi
          node scripts/report-failure.mjs results/dynamodb.json "$RUN_URL" "${drift_args[@]}" > "$RUNNER_TEMP/issue-body.md"

          gh label create scheduled-red       --color B60205 --description "Scheduled conformance run went red" 2>/dev/null || true
          gh label create aws-drift-confirmed  --color 5319E7 --description "Scheduled red is confirmed AWS wording drift" 2>/dev/null || true
          gh label create likely-flake         --color FBCA04 --description "Scheduled red shows no wording drift; likely transient" 2>/dev/null || true

          labels="scheduled-red"
          if [ -f "$RUNNER_TEMP/verdict.txt" ]; then
            labels="$labels,$(cat "$RUNNER_TEMP/verdict.txt")"
          fi

          existing=$(gh issue list --label scheduled-red --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --add-label "$labels" >/dev/null
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --label "$labels" \
              --title "Scheduled conformance run went red ($(date -u +%Y-%m-%d))" \
              --body-file "$RUNNER_TEMP/issue-body.md"
          fi

  test-dynamodb-integrations:
    name: DynamoDB service integrations (non-gating)
    # DynamoDB's integrations with other AWS services (S3 export/import, Kinesis
    # streaming destinations). No emulator implements them, so they can't be
    # compared, and they lean on slow async calls - so they run off the gating
    # path and continue-on-error, where a slow import can't red the build.
    # `needs` plus the shared conformance-aws group serialise this against the
    # gating job so the two don't race the by-prefix table cleanup; `always()`
    # keeps it running even when the gate is red.
    needs: test-dynamodb
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-latest
    concurrency:
      group: conformance-aws
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    environment: conformance-testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 7200

      - name: Run service-integration suite (S3 export/import, Kinesis)
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: dynamodb
          AWS_REGION: eu-west-2
        run: npm run test:integrations

      - name: Sanitize account IDs
        if: always()
        run: node scripts/sanitize-arns.mjs

      - name: Cleanup conformance tables
        if: always()
        timeout-minutes: 3
        run: |
          aws dynamodb list-tables --query "TableNames[?starts_with(@, '_conformance_')]" --output text | \
          tr '\t' '\n' | \
          xargs -P4 -I{} aws dynamodb delete-table --table-name {} 2>/dev/null || true

      # Uploaded under a non `results-*` name so the Update Results Table overlay
      # (which globs results-*) never folds this into the published comparison.
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: results/

  test-dynamodb-gsi:
    name: DynamoDB GSI lifecycle (non-gating)
    # The 14 UpdateTable GSI lifecycle tests. Every one adds or removes a GSI on
    # an existing table, and real AWS backfills each index for minutes: a full
    # green run was measured at 10,182s (~2h50m) in eu-west-2 on 2026-07-13, a
    # slow backfill night. That does not fit the gating job's 2h credential
    # window, which is why the file has been excluded from `test:gating` and
    # left to a manual per-PR run since 2026-05-26 - the one part of the suite
    # with no automated real-AWS observation behind it.
    #
    # This lane closes that: its own 6h credentials, its own timeout, off the
    # gate. It exists so real DynamoDB's published row is evidenced across the
    # whole suite rather than only across the gating subset.
    needs: test-dynamodb-integrations
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-latest
    # Under GitHub's own 6h ceiling on a hosted job, so the step is killed by
    # this timeout (leaving the cleanup below to run) rather than by the runner
    # vanishing mid-backfill with tables still live.
    timeout-minutes: 350
    # Same group as the gating job: that job's cleanup deletes every
    # _conformance_ table by prefix, and a GSI backfill running here would be
    # deleted out from under itself. Queue, never cancel.
    concurrency:
      group: conformance-aws
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    environment: conformance-testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          # 6h, against the ~2h50m observed worst case. The margin is the point:
          # a backfill night worse than the one on record must still finish
          # rather than expire mid-wait, because an expired credential surfaces
          # as an indeterminate - "not observed" - which is the exact silence
          # this lane exists to remove.
          role-duration-seconds: 21600

      - name: Run the GSI lifecycle suite
        continue-on-error: true
        env:
          # Names the run, and with it the indeterminate sidecar
          # (src/indeterminate-sink.ts resultSlug), so the sidecar pairs with
          # ground-truth/gsi.json rather than orphaning itself as
          # dynamodb.indeterminate.json. Real AWS is still the endpoint:
          # that is decided by DYNAMODB_ENDPOINT being unset, not by this.
          CONFORMANCE_TARGET: gsi
          CONFORMANCE_RESULTS_DIR: ground-truth
          AWS_REGION: eu-west-2
          # No CONFORMANCE_RETRY here, unlike the gating job. A retried GSI test
          # re-runs a multi-minute backfill, so absorbing a flake could add
          # tens of minutes to an already long run. A red here is non-gating
          # and triaged from the artefact instead.
        run: npm run test:gsi -- --reporter=json --outputFile=ground-truth/gsi.json

      - name: Sanitize account IDs
        if: always()
        run: node scripts/sanitize-arns.mjs

      - name: Cleanup conformance tables
        if: always()
        timeout-minutes: 10
        run: |
          aws dynamodb list-tables --query "TableNames[?starts_with(@, '_conformance_')]" --output text | \
          tr '\t' '\n' | \
          xargs -P4 -I{} aws dynamodb delete-table --table-name {} 2>/dev/null || true

      # Written to ground-truth/ and uploaded under a non `results-*` name for
      # the same reason the sweep's per-region files are: this is ground truth,
      # not a target, and the Update Results Table overlay must never fold it
      # into results/ as a phantom target row.
      - name: Upload GSI ground truth
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ground-truth-gsi
          path: ground-truth/

  ground-truth-coverage:
    name: Ground-truth coverage
    # The published DynamoDB row is synthesised at 100% across the full suite
    # size rather than scored from a results file, because real DynamoDB
    # defines correctness and cannot disagree with itself. That is the design.
    # What it assumes is that every test HAS been run against real AWS
    # somewhere - and real-AWS coverage is split across three lanes for runtime
    # reasons. This job unions them and checks the assumption holds.
    #
    # It is deliberately NOT continue-on-error. Every other real-AWS lane here
    # is non-gating because a slow AWS call is not a conformance signal; a hole
    # in ground truth is the opposite - it means the table is claiming
    # something nobody observed, which is the one failure that must not be
    # quiet.
    needs: [test-dynamodb, test-dynamodb-integrations, test-dynamodb-gsi]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Only the real-AWS lanes are needed. The suite itself comes from the
      # committed manifest, which is what the published row's denominator is;
      # this used to reconcile against whichever emulator run was widest, so a
      # truncated emulator run could shrink the population and hide a gap.
      - name: Download the real-AWS lane artefacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts

      - name: Reconcile real-AWS coverage against the suite manifest
        run: |
          shopt -s nullglob
          observed=()
          for f in /tmp/artifacts/results-dynamodb/dynamodb.json \
                   /tmp/artifacts/integration-results/dynamodb.json \
                   /tmp/artifacts/ground-truth-gsi/gsi.json; do
            [ -f "$f" ] && observed+=("$f")
          done

          # A lane that produced nothing is the gap, not a reason to skip the
          # check: silence here is exactly what would let an unobserved test
          # keep counting. Report which lanes are missing, then let the
          # reconciliation fail on their tests.
          if [ ${#observed[@]} -lt 3 ]; then
            echo "::warning::Only ${#observed[@]} of 3 real-AWS lanes produced results."
          fi
          if [ ${#observed[@]} -eq 0 ]; then
            echo "::error::No real-AWS results to reconcile."
            exit 1
          fi

          node scripts/ground-truth-coverage.mjs "${observed[@]}"

  capture-cross-region:
    name: Cross-region drift capture (non-gating)
    # Capture real AWS's negative-input wording in the candidate regions each
    # week and commit it, so the paritysuite drift lens has fresh, versioned data
    # (the site builds from committed files, not CI artefacts). Non-gating: a
    # capture hiccup never touches the build. Only candidate regions are
    # captured, never eu-west-2: the IAM role forces a _conformance_ table prefix
    # that the gating job's cleanup deletes, so an eu-west-2 capture here would
    # race that cleanup. The lens diffs these against the committed eu-west-2
    # baseline; the scheduled-run drift verdict flags when the baseline itself
    # needs refreshing.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: conformance-testing

    steps:
      - name: Mint a token for the capture bot
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RESULTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESULTS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 7200

      - name: Capture candidate regions
        run: |
          node scripts/capture-validation-messages.mjs us-east-1 ap-southeast-2 eu-central-1 \
            > captures/cross-region-latest.json

      - name: Commit the capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures/cross-region-latest.json
          if git diff --staged --quiet; then
            echo "Cross-region capture unchanged."
          else
            git commit -m "chore: update cross-region capture"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then pushed=1; break; fi
              echo "push attempt $i failed; retrying"
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::warning title=Cross-region capture::push failed after 3 attempts; this week's capture was not persisted"
              exit 1
            fi
          fi

  test-dynamodb-local:
    name: DynamoDB Local
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run conformance suite
        continue-on-error: true # Emulators have known conformance gaps
        env:
          CONFORMANCE_TARGET: dynamodb-local
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          TARGET_IMAGE: amazon/dynamodb-local:latest
        run: scripts/record-version.sh dynamodb-local

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-dynamodb-local
          path: results/

  test-localstack:
    name: LocalStack
    continue-on-error: true
    runs-on: ubuntu-latest
    # LOCALSTACK_AUTH_TOKEN is not exposed to PRs from forks, and the
    # LocalStack image refuses to start without it. Skip the job rather
    # than leave a spurious red X on every external PR.
    if: github.event.pull_request.head.repo.fork != true
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run conformance suite
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: localstack
          DYNAMODB_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          TARGET_IMAGE: localstack/localstack:latest
        run: scripts/record-version.sh localstack

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-localstack
          path: results/

  test-dynoxide:
    name: Dynoxide
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start Dynoxide
        run: |
          npx dynoxide --port 8001 &
          sleep 2

      - name: Run conformance suite
        continue-on-error: true
        env:
          CONFORMANCE_TARGET: dynoxide
          DYNAMODB_ENDPOINT: http://localhost:8001
          AWS_ACCESS_KEY_ID: fakeAccessKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_REGION: us-east-1
        run: npm test

      - name: Record target version
        continue-on-error: true
        run: scripts/record-version.sh dynoxide

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-dynoxide
          path: results/

  test-dynoxide-wasm:
    name: Dynoxide (wasm)
    # A separate engine from the native build above, scored as its own row.
    # It is the only target reachable by neither a container image nor an npm
    # binary: the wasm engine answers a postMessage RPC in a browser, and the
    # shim that puts a DynamoDB endpoint in front of it is unpublished. So this
    # builds it from a Dynoxide checkout, which makes it as heavy as ExtendDB
    # and it skips PRs for the same reason.
    #
    # Until this job existed the row was refreshed by hand, and it went three
    # weeks without a run while tests moved between files underneath it. Its
    # count still matched the suite, so nothing noticed.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the engine's repository and ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The organisation comes from the target registry, where a target's
          # project URL is data. Writing it here would have the workflow name a
          # vendor, which scripts/public-tree.test.mjs refuses and which is the
          # difference between a neutral board and somebody's marketing. The
          # registry module has no imports, so this runs before npm ci.
          REPO=$(node --input-type=module -e "
            import { repoUrl } from './scripts/lib/targets.mjs'
            process.stdout.write(new URL(repoUrl('dynoxide')).pathname.slice(1))
          ")
          REF='${{ github.event.inputs.dynoxide_wasm_ref }}'
          if [ -z "$REF" ]; then
            REF=$(gh release view -R "$REPO" --json tagName --jq .tagName)
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building the wasm engine from $REPO at $REF"

      - name: Checkout the engine
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.ref.outputs.repo }}
          ref: ${{ steps.ref.outputs.ref }}
          path: dynoxide

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dynoxide

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # From npm rather than the upstream shell installer, so the version is
      # pinned by a lockfile-shaped thing and nothing pipes curl into sh.
      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.15.0

      - name: Build and start the wasm engine
        env:
          DYNOXIDE_DIR: ${{ github.workspace }}/dynoxide
        run: ./scripts/run-dynoxide-wasm.sh

      - name: Run conformance suite
        continue-on-error: true # a preview: PartiQL, transactions, tags and TTL skip
        env:
          CONFORMANCE_TARGET: dynoxide-wasm
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          DYNOXIDE_WASM_REF: ${{ steps.ref.outputs.ref }}
        run: scripts/record-version.sh dynoxide-wasm

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-dynoxide-wasm
          path: results/

