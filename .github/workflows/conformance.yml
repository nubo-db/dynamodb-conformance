  test-extenddb:
    name: ExtendDB
    # ExtendDB ships no binaries and `main` is a moving target, so CI builds its
    # latest tagged *release* from source (override via the workflow_dispatch
    # input). The Rust build makes this the heaviest job, so it skips PRs and
    # runs on push, the weekly schedule, manual dispatch, and ExtendDB releases.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Resolve ExtendDB ref (latest release unless overridden)
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF='${{ github.event.inputs.extenddb_ref }}'
          if [ -z "$REF" ]; then
            REF=$(gh release view -R ExtendDB/extenddb --json tagName --jq .tagName)
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building ExtendDB at $REF"

      - name: Checkout ExtendDB
        uses: actions/checkout@v7
        with:
          repository: ExtendDB/extenddb
          ref: ${{ steps.ref.outputs.ref }}
          path: extenddb

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extenddb

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and start ExtendDB, mint conformance credentials
        env:
          EXTENDDB_DIR: ${{ github.workspace }}/extenddb
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/run-extenddb.sh

      - name: Run conformance suite
        continue-on-error: true # ExtendDB has known gaps (e.g. PartiQL)
        env:
          CONFORMANCE_TARGET: extenddb
        run: npm test

      - name: Record target version
        continue-on-error: true
        env:
          EXTENDDB_REF: ${{ steps.ref.outputs.ref }}
        run: scripts/record-version.sh extenddb

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-extenddb
          path: results/
