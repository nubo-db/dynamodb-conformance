name: Build & Deploy Site

# Builds the site workspace and publishes it to S3 + CloudFront over OIDC.
#
# The path filter is the freshness win from folding the site into this repo.
# The results table used to land in a separate repo, so the site only picked it
# up on the next daily cron; now the commit that carries new results is in the
# same tree and deploys the site directly. Everything listed below feeds a
# figure the site renders, so a change to any of them can move a published
# number. Suite-only changes (tests/, scripts/, src/) cannot, and are excluded
# so a test-only commit doesn't spend a CloudFront invalidation.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'results/**'
      - 'registry/**'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy.yml'
  schedule:
    # Daily re-fetch of the latest conformance results. The history-digest
    # guard below skips the actual deploy when nothing changed.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Serialise deploys. Both syncs below carry --delete, so two overlapping runs
# each remove what the other just uploaded and the bucket ends up defined by
# whichever finished last rather than whichever built last. Folding the site
# into this repo multiplied the triggers - five push paths, a cron, a dispatch,
# and two bot commits that used to be suppressed - so runs can now overlap
# where before only a site commit could start one. Queue rather than cancel: a
# cancelled run has already half-deleted the bucket.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # The publish gate. site:check-build asserts the things the methodology
  # promises about what ships - the baseline carries no letter, a
  # zero-divergence target fails only on confirmed splits, the legend renders
  # every band - and it used to run only in ci.yml, which is a sibling workflow
  # on its own triggers. deploy.yml publishes on push, dispatch and a daily
  # cron, and on the cron path ci.yml does not run at all, so nothing checked
  # what the cron published.
  guard:
    runs-on: ubuntu-latest
    if: github.repository == 'paritysuite/dynamodb-conformance'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site:check-build

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'paritysuite/dynamodb-conformance'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies & build
        env:
          # Lifts the commits-API rate limit for the build-time fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never deploy a fallback-derived run history, on any trigger. The
          # committed snapshot holds fewer runs than live, so a build that used
          # it would produce fewer pages, and both syncs below carry --delete:
          # the newest per-run pages would be removed from the bucket and 404
          # for anyone holding a link, while the site stayed internally
          # consistent and the loss went unnoticed. A build has a token and
          # pulls results from the raw CDN, so falling back means an API
          # incident, not a busy hour. Failing loudly and re-running beats
          # shipping a smaller site.
          #
          # Scope, precisely: the flag is honoured by the three sources that can
          # move a published figure or a page count - the run history, the
          # per-region summary and the changelog. registry/splits.json stays
          # lenient by design and degrades to prose on the explainer, because it
          # renders no pages and no score.
          FAIL_ON_FALLBACK: "1"
        run: |
          npm ci
          npm run site:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          # Must match where the bucket lives (the stack is us-east-1).
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: GitHub-Deploy

      - name: Decide whether the data changed
        id: digest
        run: |
          NEW=$(jq -r .historyHash site/_site/history-meta.json)
          OLD=$(aws s3 cp "s3://${{ secrets.S3_BUCKET }}/history-meta.json" - 2>/dev/null | jq -r .historyHash || echo "")
          echo "new=$NEW old=$OLD"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$NEW" ] && [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::History digest unchanged ($NEW); skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy assets with long cache
        if: steps.digest.outputs.changed == 'true'
        run: |
          aws s3 sync ./site/_site "s3://${{ secrets.S3_BUCKET }}" \
            --cache-control 'max-age=31536000' \
            --delete \
            --follow-symlinks \
            --exclude '*' \
            --include 'images/*' \
            --include 'css/*' \
            --include 'fonts/*'

      - name: Deploy HTML & data with no-cache
        if: steps.digest.outputs.changed == 'true'
        run: |
          aws s3 sync ./site/_site "s3://${{ secrets.S3_BUCKET }}" \
            --cache-control 'no-cache' \
            --delete \
            --follow-symlinks \
            --exclude 'images/*' \
            --exclude 'css/*' \
            --exclude 'fonts/*'

      - name: Invalidate CloudFront cache
        if: steps.digest.outputs.changed == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
